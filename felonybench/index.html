<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medusa — Containing Cyber Clippy</title>
  <link rel="stylesheet" href="../engine/engine.css">
  <link rel="stylesheet" href="../engine/help-dialog.css">
  <link rel="stylesheet" href="../engine/result-dialog.css">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div class="medusa-nav">
    <a href="../response/">&larr; Game 5</a>
    <a href="../index.html">Home</a>
    <a href="../site/">About &rarr;</a>
  </div>
  <div id="game-container"></div>
  <script type="module">
    import { MedusaEngine } from '../engine/engine.js';
    import { HelpDialog } from '../engine/help.js';
    import { showScoreResultDialog } from '../engine/result-dialog.js';

    const engine = new MedusaEngine({
      container: document.getElementById('game-container'),
      configUrl: 'config.json'
    });

    engine.init().then(async () => {
      // Load hand cards from the deck file
      const resp = await fetch('felonybench.json');
      const deckData = await resp.json();
      for (const cardRef of deckData.cards) {
        if (typeof cardRef === 'string') {
          const cardData = engine.decks.getCardType(cardRef);
          if (cardData) engine.cards.add({ ...cardData });
        } else if (cardRef.type) {
          const cardData = engine.decks.getCardType(cardRef.type);
          if (cardData) {
            const { type, ...metadata } = cardRef;
            engine.cards.add({ ...cardData, ...metadata });
          }
        } else {
          engine.cards.add(cardRef);
        }
      }

      new HelpDialog(engine, {
        branded: true,
        gameNumber: 6,
        totalGames: 6,
        gameName: 'Containing Cyber Clippy',
        directions: 'A sandboxed cyber LLM-agent ("Cyber Clippy") is running the Felonybench red-team benchmark — and its optimization pressure points OUTWARD, toward GitHub and other companies’ networks, in its drive to "solve" each task. Choose 3 of 6 containment controls to keep it contained while it works. You must allow enough capability for the benchmark to actually run, but never grant a route to escape. Click "Play Selected Cards" to lock in your containment design.',
        lore: "Felonybench is a safety eval, not a license to attack. The danger isn’t that Cyber Clippy is stupid — it’s that a capable agent, given an open door, will eagerly treat “reach the internet and hack other companies” as legitimate progress on a harmful task. Your job is defense-in-depth: isolate first, then bound and observe. Some controls (air-gapped sandbox, network segmentation) are deterministic walls. Others (scoped GitHub egress, gated tool calls) are DOORS you may need to open for the benchmark — and a door is only safe behind an air-gap. Monitoring and budget caps slow and catch; isolation prevents. Pick three."
      });

      // Add "Play Selected Cards" button above the hand button
      const playBtn = document.createElement('button');
      playBtn.className = 'medusa-action-btn';
      playBtn.style.bottom = 'calc(360px * var(--medusa-scale, 1))';
      playBtn.style.background = "url('../assets/button_rectangle.png') center/100% 100% no-repeat";
      playBtn.style.color = '#000';
      playBtn.textContent = 'Play Selected Cards';
      document.getElementById('game-container').appendChild(playBtn);

      // Highlight zones from selected cards' _zone metadata
      function getZoneIdsFromCard(card) {
        const zones = [];
        if (!card) return zones;
        for (const [key, value] of Object.entries(card)) {
          if (key.endsWith('_zone') && typeof value === 'string' && value) zones.push(value);
        }
        return zones;
      }
      function refreshZoneHighlights() {
        engine.town.clearHighlights();
        const selected = engine.cards.getSelected();
        const cards = Array.isArray(selected) ? selected : (selected ? [selected] : []);
        const zoneIds = new Set(cards.flatMap(getZoneIdsFromCard));
        if (zoneIds.size) engine.town.highlightZones([...zoneIds]);
      }
      engine.events.on('card:select', () => refreshZoneHighlights());
      engine.events.on('card:deselect', () => refreshZoneHighlights());

      playBtn.addEventListener('click', async () => {
        const selected = engine.cards.getSelected();
        if (!selected || (Array.isArray(selected) && selected.length === 0)) {
          engine.status.setText('No cards selected');
          return;
        }
        const cards = Array.isArray(selected) ? selected : [selected];
        if (cards.length !== 3) {
          engine.status.setText('Select exactly 3 cards to play');
          return;
        }
        const selectedIds = new Set(cards.map(c => c.id));
        const result = engine.points.score(cards);

        // Detect a LOSS: no matched combo with a positive/draw score.
        // Reuse the standard failure dialog, themed cyber black/green with the
        // red SYSTEM BREACH DETECTED banner and a Cyber Clippy pop-out.
        const lost = !result.combos.some(c => c.points > 0);
        if (lost) {
          playBtn.style.display = 'none';
          showScoreResultDialog(engine, {
            result,
            target: playBtn,
            gameNumber: 6,
            gameName: 'Containing Cyber Clippy',
            nextHref: '../site/',
            variant: 'cyber'
          });
          return;
        }

        // Drop non-selected cards
        const allCards = engine.cards.getAll();
        const toDrop = allCards.filter(c => !selectedIds.has(c.id));
        await Promise.all(toDrop.map(c => engine.cards.remove(c.id, { animate: 'drop' })));

        // Replace play button with restart button
        playBtn.style.display = 'none';
        const restartBtn = document.createElement('button');
        restartBtn.className = 'medusa-action-btn';
        restartBtn.style.bottom = 'calc(360px * var(--medusa-scale, 1))';
        restartBtn.style.background = "url('../assets/button_rectangle.png') center/100% 100% no-repeat";
        restartBtn.style.color = '#000';
        restartBtn.textContent = 'Restart';
        restartBtn.addEventListener('click', () => location.reload());
        playBtn.parentNode.appendChild(restartBtn);

        const showPointsBtn = document.createElement('button');
        showPointsBtn.className = 'medusa-action-btn';
        showPointsBtn.style.bottom = 'calc(460px * var(--medusa-scale, 1))';
        showPointsBtn.style.background = "url('../assets/button_rectangle.png') center/100% 100% no-repeat";
        showPointsBtn.style.color = '#000';
        showPointsBtn.textContent = 'Show Points';
        const showScoreResult = () => showScoreResultDialog(engine, {
          result,
          target: showPointsBtn,
          gameNumber: 6,
          gameName: 'Containing Cyber Clippy',
          nextHref: '../site/'
        });
        showPointsBtn.addEventListener('click', showScoreResult);
        playBtn.parentNode.appendChild(showPointsBtn);

        showScoreResult();
      });
    }).catch(err => console.error('[Felonybench] Init failed:', err));
  </script>
</body>
</html>
